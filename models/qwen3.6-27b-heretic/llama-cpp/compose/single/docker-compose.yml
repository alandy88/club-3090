# ===========================================================================
# Profile (at-a-glance):
#   Model:     Qwen3.6-27B uncensored-heretic-v2 (Q4_K_M GGUF, MTP preserved)
#   Engine:    llama.cpp
#   Topology:  Single 3090 (TP=1)
#   Drafter:   none (MTP heads preserved in GGUF but llama.cpp mainline
#              does not use them yet — PR #22673 unmerged)
#   KV:        q4_0
#   Vision:    no (no mmproj available for this finetune)
#   Max ctx:   131072 (Q4_K_M is ~17 GB; 262K would exceed 24 GB VRAM)
#   Genesis:   N/A
#   Status:    ✅ Production
#   Engine-profile: llama-cpp-mainline
#   Best for:  Uncensored single-card path — cliff-immune, ~21 TPS
# ---------------------------------------------------------------------------
# Requires-min-vram-gb: 24
# Engine-profile: llama-cpp-mainline
# Requires-min-gpu-count: 1
# Tensor-parallel: 1
services:
  llama-cpp-qwen36-27b-heretic:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: "${ESTATE_CONTAINER:-llama-cpp-qwen36-27b-heretic}"
    restart: unless-stopped
    ports:
      - "${ESTATE_PORT:-${PORT:-8020}}:8080"
    volumes:
      - "${MODEL_DIR:-/home/peteryu/Git/models}:/models:ro"
    entrypoint:
      - bash
      - -c
      - |
        set -e
        EXTRA_ARGS=()
        if [ "$${DISABLE_THINKING:-1}" = "1" ]; then
          EXTRA_ARGS+=("--chat-template-kwargs" '{"enable_thinking":false}')
          echo "[entrypoint] DISABLE_THINKING=1 — thinking disabled"
        fi
        exec /app/llama-server "$$@" "$${EXTRA_ARGS[@]}"
      - --
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -m
      - /models/${GGUF_FILE:-Qwen3.6-27B-uncensored-heretic-v2-MTP-Q4_K_M.gguf}
      - -c
      - "${CTX_SIZE:-131072}"
      - -b
      - "${BATCH_SIZE:-4096}"
      - -ub
      - "${UBATCH_SIZE:-2048}"
      - -ngl
      - "99"
      - -fa
      - "on"
      - --cache-type-k
      - "${KV_TYPE:-q4_0}"
      - --cache-type-v
      - "${KV_TYPE:-q4_0}"
      - -np
      - "1"
      - --jinja
      - --reasoning-format
      - "${REASONING_FORMAT:-none}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ESTATE_GPUS:-${CUDA_VISIBLE_DEVICES:-0}}"]
              capabilities: [compute, utility]
