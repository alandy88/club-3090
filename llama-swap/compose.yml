# =============================================================================
# llama-swap — multi-model hot-swap proxy for RTX 3090
#
# Bundles: llama-server (stock), ik-llama-server, atomic-llama-server, bee-llama-server
# Config: selected via LLAMA_CONFIG env var (default: config-ik.yaml)
#
# Build:
#   docker compose build
# Run (ik-llama + atomic backend):
#   docker compose up -d
# Run (beellama backend):
#   LLAMA_CONFIG=config-bee.yaml docker compose up -d
# Test:
#   curl http://localhost:8020/v1/models
# =============================================================================
services:
  llama-swap:
    build:
      context: .
      dockerfile: Dockerfile
    image: llama-swap:custom-cuda
    container_name: llama-swap
    restart: unless-stopped
    ports:
      - ${PORT:-8020}:8080
    volumes:
      - ${MODEL_DIR:-/home/peteryu/llms}:/models:ro
      - ./${LLAMA_CONFIG:-config-ik.yaml}:/etc/llama-swap/config/config.yaml:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - ${CUDA_VISIBLE_DEVICES:-0}
              capabilities:
                - compute
                - utility
