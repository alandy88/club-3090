# =============================================================================
# llama-swap config — beellama backend, single RTX 3090 (24 GB), hot-swap
#
# Engine: beellama.cpp v0.2.0 (Anbeeld fork — DFlash + TurboQuant)
# Cache:  q5_0 K / q4_1 V (upstream "precision combo" default)
# Gemma:  DFlash speculative + Anbeeld IQ4_XS drafter
#
# SERVES NO QWEN. The two Qwen3.6-27B heretic-v2 entries were retired and their
# weights deleted. Selecting this config removes Qwen from the stack; it is not
# a Qwen backend switch.
# =============================================================================

healthCheckTimeout: 120
logLevel: info
globalTTL: 300

models:
  # RETIRED — the two Qwen3.6-27B heretic-v2 entries (Q5_K_S and Q4_K_M),
  # superseded by Qwen3.8-27B on the ik config. Their weights are deleted from
  # the box, so this is NOT a config-only revert.
  # Their drafter, dflash-draft-3.6-q4_k_m.gguf, is now unused but kept on disk.

  "gemma-4-31B-it-uncensored-heretic-Q4_K_M":
    cmd: |
      bee-llama-server
      --port ${PORT}
      -m /models/gemma-4-31B-it-uncensored-heretic-Q4_K_M.gguf
      --spec-type dflash
      --spec-draft-model /models/gemma4-31b-it-dflash-IQ4_XS.gguf
      --spec-draft-ngl all
      --spec-dflash-cross-ctx 1024
      -c 131072
      -b 2048
      -ub 512
      -ngl all
      -fa on
      --cache-type-k q5_0
      --cache-type-v q4_1
      -np 1
      --kv-unified
      --cache-ram 0
      --no-mmap
      --mlock
      --no-host
      --metrics
      --jinja
      --reasoning on
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --min-p 0.0

  "Gembrain-31B-Q4_K_M":
    cmd: |
      bee-llama-server
      --port ${PORT}
      -m /models/Gembrain-31B-Q4_K_M.gguf
      --spec-type dflash
      --spec-draft-model /models/gemma4-31b-it-dflash-IQ4_XS.gguf
      --spec-draft-ngl all
      --spec-dflash-cross-ctx 1024
      -c 131072
      -b 2048
      -ub 512
      -ngl all
      -fa on
      --cache-type-k q5_0
      --cache-type-v q4_1
      -np 1
      --kv-unified
      --cache-ram 0
      --no-mmap
      --mlock
      --no-host
      --metrics
      --jinja
      --reasoning on
      --temp 1.0
      --top-p 0.95
      --top-k 0
      --min-p 0.03
