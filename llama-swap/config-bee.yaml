# =============================================================================
# llama-swap config — beellama backend, single RTX 3090 (24 GB), hot-swap
#
# Engine: beellama.cpp v0.2.0 (Anbeeld fork — DFlash + TurboQuant)
# Cache:  q5_0 K / q4_1 V (upstream "precision combo" default)
# Qwen:   DFlash speculative + spiritbuun Q4_K_M drafter
# Gemma:  DFlash speculative + Anbeeld IQ4_XS drafter
# =============================================================================

healthCheckTimeout: 120
logLevel: info
globalTTL: 300

models:
  "Qwen3.6-27B-heretic-v2-Q5_K_S":
    cmd: |
      bee-llama-server
      --port ${PORT}
      -m /models/Qwen3.6-27B-uncensored-heretic-v2-Q5_K_S.gguf
      --spec-type dflash
      --spec-draft-model /models/dflash-draft-3.6-q4_k_m.gguf
      --spec-draft-ngl all
      --spec-draft-n-max 12
      --spec-dflash-cross-ctx 1024
      -c 131072
      -b 2048
      -ub 512
      -ngl all
      -fa on
      --cache-type-k q5_0
      --cache-type-v q4_1
      -np 1
      --kv-unified
      --cache-ram 0
      --no-mmap
      --mlock
      --no-host
      --metrics
      --jinja
      --reasoning on
      --reasoning-budget 256
      --temp 0.6
      --top-p 1.0
      --top-k 20
      --min-p 0.0

  "Qwen3.6-27B-heretic-v2-Q4_K_M":
