# =============================================================================
# llama-swap config — 7 models, single RTX 3090 (24 GB), hot-swap on demand
#
# Shared flag sets live in `macros:` and are spliced into each model's `cmd`
# via ${macro_name}. llama-swap shlex-parses the result, so whitespace
# (including newlines from `|` block scalars) is irrelevant.
# =============================================================================

healthCheckTimeout: 120
logLevel: debug
logToStdout: "upstream"
globalTTL: 300

macros:
  # ---------- Qwen3.6 vision-MoE (ik-llama backend) ----------
  # Per-model overrides only: -m, --mmproj, and (for 35B-A3B) -ngld 99.
  "qwen_base": |
    ik-llama-server
    --chat-template-kwargs '{"preserve_thinking":true}'
    --port ${PORT}
    --threads 8
    --threads-batch 8
    --threads-mtmd 8
    -c 156000
    -ngl 99
    -fa on
    -b 1024
    -ub 512
    -amb 512
    --cache-type-k q8_0
    --cache-type-v q6_0
    -khad
    -vhad
    --cache-ram 32768
    --cache-ram-similarity 0.50
    --cache-ram-n-min 0
    --spec-type mtp:n_max=5,p_min=0.5
    --spec-autotune
    --merge-qkv
    --merge-up-gate-experts
    --ctx-checkpoints 32
    -np 1
    --jinja
    --parallel-tool-calls
    --reasoning on
    --reasoning-format deepseek
    --chat-template-file /models/qwen3.6-chat-template.jinja
    --no-mmproj-offload
    --image-min-tokens 1024
    --image-max-tokens 4096
    --temp 0.6
    --top-p 0.95
    --top-k 20
    --min-p 0
    --metrics
    --verbose-prompt

  # qwen_base minus MTP/draft flags — for quants without nextn (MTP) tensors.
  "qwen_base_nomtp": |
    ik-llama-server
    --chat-template-kwargs '{"preserve_thinking":true}'
    --port ${PORT}
    --threads 8
    --threads-batch 8
    --threads-mtmd 8
    -c 156000
    -ngl 99
    -fa on
    -b 1024
    -ub 512
    -amb 512
    --cache-type-k q8_0
    --cache-type-v q6_0
    -khad
    -vhad
    --cache-ram 32768
    --cache-ram-similarity 0.50
    --cache-ram-n-min 0
    --merge-qkv
    --merge-up-gate-experts
    --ctx-checkpoints 32
    -np 1
    --jinja
    --parallel-tool-calls
    --reasoning on
    --reasoning-format deepseek
    --chat-template-file /models/qwen3.6-chat-template.jinja
    --no-mmproj-offload
    --image-min-tokens 1024
    --image-max-tokens 4096
    --temp 0.6
    --top-p 0.95
    --top-k 20
    --min-p 0
    --metrics
    --verbose-prompt

  # Sampling used by the "creative" Gemma-4 heretic variants.
  "gemma_sampling_creative": |
    --temp 1.0
    --top-p 0.95
    --top-k 64
    --dry-multiplier 0.4
    --dry-base 1.75
    --dry-allowed-length 2
    --dry-penalty-last-n -1

  # ---------- Gemma-4 26B-A4B MoE DFlash (beellama backend) ----------
  # Swapped from atomic-MTP -> beellama DFlash. Q8/Q5_1 KV. Vision via mmproj (CPU offload).
  # DO NOT migrate this to bee v0.4.x. v0.4.0 swapped the fork DFlash for
  # upstream draft-dflash, which regresses this entry two ways on a 24 GB card:
  # Anbeeld#98 (closed won't-fix, "use v0.3.1/v0.3.2 for the time being") — the
  # drafter builds a full MTP context, so 102K-160K configs fit only ~27K; and
  # ggml-org/llama.cpp#26108 (open) — draft-dflash plus --mmproj fails to read
  # images. This entry is 156K AND has a projector, so it hits both. Bee stays
  # pinned at v0.3.1 until upstream fixes them.
  "gemma_bee_engine_26b": |
    bee-llama-server
    --port ${PORT}
    --spec-type dflash
    --spec-draft-model /models/gemma4-26b-a4b-it-dflash-IQ4_XS.gguf
    --spec-draft-ngl all
    --spec-dflash-cross-ctx 1024
    -c 156000
    -ngl all
    -b 2048
    -ub 512
    --flash-attn on
    --cache-type-k q8_0
    --cache-type-v q5_1
    --kv-unified
    --cache-ram 0
    --no-mmap
    --mlock
    --no-host
    -np 1
    --jinja
    --reasoning on
    --metrics

models:
  # -------- Qwen3.6 vision-MoE --------
  "Qwen3.6-27B":
    cmd: |
      ${qwen_base}
      -m /models/Qwen3.6-27B-MTP-IQ4_KS.gguf
      --mmproj /models/mmproj-Qwen3.6-27B-BF16.gguf

  # ==========================================================================
  # Qwen3.6 35B-A3B — shapelearn default + heretic served.
  # Benched 2026-06-01 (ik-llama, -c 156000, thinking off; wall tok/s narr/code):
  #   DEFAULT shapelearn (MTP) .... 155 / 194,  21.2 GB  (faster code via MTP)
  #   heretic (no-MTP) ............ 165 / 162,  20.0 GB  (uncensored)
  #   apex I-Compact (no-MTP) ..... 158 / 155,  18.7 GB  (smallest, most headroom)
  # ==========================================================================

  # DEFAULT — original ShapeLearn (byteshape) IQ4_XS, native MTP speculation.
  # Same quant upstream validated as best single-3090 8-pack (byteshape-iq4xs/mtp.yml).
  "Qwen3.6-35B":
    cmd: |
      ${qwen_base}
      -m /models/Qwen3.6-35B-A3B-IQ4_XS-3.97bpw.gguf
      --mmproj /models/mmproj-Qwen3.6-35B-A3B-BF16.gguf
      -ngld 99

  # mradermacher i1-IQ4_XS uncensored heretic (no MTP tensors).
  "Qwen3.6-35B-Heretic":
    cmd: |
      ${qwen_base_nomtp}
      -m /models/Qwen3.6-35B-A3B-uncensored-heretic.i1-IQ4_XS.gguf
      --mmproj /models/mmproj-Qwen3.6-35B-A3B-BF16.gguf

  # ALT (inactive) — mudler APEX I-Compact, uncensored, no MTP (smallest / most headroom).
  # "Qwen3.6-35B-apex":
  #   cmd: |
  #     ${qwen_base_nomtp}
  #     -m /models/Qwen3.6-35B-A3B-uncensored-heretic-APEX-I-Compact.gguf
  #     --mmproj /models/mmproj-Qwen3.6-35B-A3B-BF16.gguf

  # RETIRED — Gemma4-31B (uncensored-heretic) and Gemma4-31B-Gembrain, both on
  # the gemma_bee_engine macro (removed with them). Weights stay in /models
  # (gemma-4-31B-it-uncensored-heretic-Q4_K_M.gguf, Gembrain-31B-Q4_K_M.gguf)
  # along with their gemma4-31b-it-dflash-IQ4_XS.gguf draft, so the revert is
  # config-only.

  # -------- Gemma-4 26B-A4B MoE MTP --------
  # QAT-heretic UD-Q4_K_XL weights (~13.3 GiB; Google QAT base, near-bf16 @ 4-bit)
  # on the DFlash/156K macro. ~4 GB smaller than the prior Q5_K_M -> more headroom.
  "Gemma4-26B":
    cmd: |
      ${gemma_bee_engine_26b}
      -m /models/gemma-4-26B-A4B-it-qat-heretic-UD-Q4_K_XL.gguf
      --mmproj /models/mmproj-gemma-4-26B-A4B-BF16.gguf
      --no-mmproj-offload
      ${gemma_sampling_creative}


  # -------- Gemma-4 12B (bee — long-ctx + vision; no DFlash drafter published) --------
  # Original-model UD-Q8_K_XL (~13.6 GiB; QAT Q4 retired — Q8 of the original tracks
  # BF16 closer, see unsloth QAT KLD table). 256K ctx: --override-kv lifts the 131K
  # n_ctx_train cap; p-RoPE extrapolates cleanly (upstream NIAH @ 200K).
  # Stock Gemma sampling. f16 KV: ~19 GB fit.
  "Gemma4-12B":
    cmd: |
      bee-llama-server
      --port ${PORT}
      -m /models/gemma-4-12b-it-UD-Q8_K_XL.gguf
      --mmproj /models/mmproj-gemma-4-12B-BF16.gguf
      --no-mmproj-offload
      -c 262144
      --override-kv gemma4.context_length=int:262144
      -ngl all
      -b 2048
      -ub 512
      --flash-attn on
      --cache-type-k f16
      --cache-type-v f16
      --kv-unified
      --cache-ram 0
      --no-mmap
      --mlock
      --no-host
      -np 1
      --jinja
      --reasoning on
      --metrics
      --temp 1.0
      --top-k 64
      --top-p 0.95
      --min-p 0.0

  # -------- Muse Glimmer 30B (stock — dense 30B VLM, agentic/long-context) --------
  # Dense 27.86B, 52 layers, GQA 32:2, head_dim 128, RoPE theta 500k, vision via a
  # ~1.8B ViT. Stock llama-server, not ik/bee: upstream added muse-glimmer at b10353
  # and the deployed base carries 1f368f3, so this is config-only — no engine bump.
  #
  # HYBRID ATTENTION is why 131K KV is affordable at f16. GGUF metadata gives
  # sliding_window=2048 and sliding_window_pattern=4, i.e. [L,L,L,G] -> 13 global +
  # 39 SWA layers of 52. Only the 13 global layers scale with context: 13*2*128*2*2
  # = 13312 B/token, so 131072 ctx = 1.63 GiB, plus ~78 MiB for the capped SWA
  # layers. DO NOT ADD --swa-full: it lifts the 2048 cap on all 39 SWA layers and
  # makes KV ~8.6x larger. f16 KV per house convention for stock entries; q6_0 is an
  # ik-only cache type and stock rejects it outright ("Unsupported cache type").
  #
  # -c 131072 is EXACTLY the model's native context_length from GGUF metadata, so no
  # --override-kv is needed (verified: n_ctx_slot = 131072, no cap warning). Do not
  # raise to 262144 the way Gemma4-12B does — that entry's override is justified by
  # upstream p-RoPE NIAH validation at 200K, and Glimmer has no equivalent evidence;
  # it would be 2x extrapolation past trained length on faith.
  #
  # DFlash speculation, NOT MTP — this model ships no MTP tensors. --spec-draft-n-max
  # 15 sits at the drafter's block_size=16 ceiling and is the measured optimum, which
  # inverts the usual reading: acceptance RATE falls as n_max rises, but throughput
  # follows mean accepted RUN LENGTH. Measured 2026-08-14 (greedy, identical prompt,
  # 3 runs each): n_max off 48.8 tok/s; n_max 3 -> 59.8 (accept 0.59, len 2.77);
  # n_max 7 -> 54.8-56.3 (accept 0.47, len 4.3); n_max 15 -> 123-133 (accept
  # 0.29-0.33, len 5.35-5.88). 15 is ~2.4x faster than 7 despite half the acceptance.
  #
  # VISION AND DFLASH COEXIST HERE. llama.cpp #26108 (draft-dflash + --mmproj breaks
  # image reads) is the bug pinning Gemma4-26B to bee v0.3.1, but it does NOT
  # reproduce on this path: with DFlash active at n_max 15, solid red/blue/green
  # probes returned "red"/"blue"/"green" 3/3. Tool calls also verified — the PEG
  # parser returned finish_reason=tool_calls with clean arguments.
  #
  # REASONING DEPTH IS A SYSTEM-PROMPT FIELD, not a CLI flag: send
  # "Reasoning strength: low|medium|high|xhigh" in the system message. This is why
  # there is no --reasoning here despite the Qwen entries carrying one.
  # --reasoning-preserve keeps the trace across turns (template-gated).
  #
  # Weights are the AaryanK imatrix line (AK-Q4_K_XL, 16.26 GB, 4.669 bpw), not
  # Unsloth's UD-Q4_K_XL (15.88 GB, 4.560 bpw). AK publishes KLD tables Unsloth does
  # not: 0.012286 vs 0.014714 mean KLD (-16.5%) and 95.65% vs 95.25% top-1. Measured
  # cost of that trade on-box: ~5% decode (123-130 vs 126-134 tok/s) and +360 MiB.
  # NOTE the AK- prefix means custom per-tensor allocation — AK-Q4_K_M is NOT a stock
  # Q4_K_M, so cross-line quant comparisons by name are meaningless.
  #
  # Measured VRAM: 19196 MiB for this entry (weights + mmproj + drafter + f16 KV +
  # compute). With the persistent embedder (~2110 MiB) that is ~21.3 GB of 24.
  #
  # SETTLED: the AaryanK drafter (dflash-Muse-Glimmer-30B-assistant-Q8_0.gguf, 2.73 GB)
  # was benched against the 1.63 GB Unsloth kquant drafter below and REJECTED. Same
  # throughput within noise (122.1-126.9 vs 123.5-130.2 tok/s) for +1048 MiB VRAM
  # (20244 vs 19196). Its mean accepted run was marginally longer (5.48 vs 5.35) but
  # that did not convert into speed. Higher drafter precision is not the bottleneck.
  #
  # NO --cache-ram HERE, deliberately — the 8192 MiB default applies. The entry
  # originally copied --cache-ram 0 from the bee anchor, which disabled the host
  # prompt cache outright (and with it --cache-idle-slots, which requires it).
  # With -np 1 the single slot is overwritten by every new conversation, so with
  # no RAM cache a returning conversation could never be restored and always paid
  # a full reprocess. In-slot LCP reuse was never broken (an exact repeat evaluates
  # 1 token); the RAM cache is what covers the gap ACROSS conversations. It is host
  # memory, not VRAM, so the 24 GB budget above is unaffected.
  #
  # Known wart: load logs warn "special_eot_id is not in special_eog_ids - the
  # tokenizer config may be incorrect". No misbehaviour observed across all probes
  # (generation terminated correctly every time), but watch for runaway output.
  "Muse-Glimmer-30B":
    cmd: |
      llama-server
      --port ${PORT}
      -m /models/Muse-Glimmer-30B-AK-Q4_K_XL.gguf
      --mmproj /models/mmproj-kquant.gguf
      --spec-type draft-dflash
      --spec-draft-model /models/dflash-kquant.gguf
      --spec-draft-ngl 99
      --spec-draft-n-max 15
      -c 131072
      -ngl 99
      -fit off
      --threads 8
      --threads-batch 8
      -b 2048
      -ub 512
      --flash-attn on
      --cache-type-k f16
      --cache-type-v f16
      --kv-unified
      --no-mmap
      --mlock
      --no-host
      -np 1
      --jinja
      --reasoning-preserve
      --no-mmproj-offload
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --min-p 0
      --metrics

  # -------- ToriiGate-0.5 (stock — Qwen3.5-4B VLM, Danbooru/anime captioner) --------
  # Single-image, single-turn captioner (Minthy/ToriiGate-0.5; DraconicDragon GGUF).
  # Q8_0 LM (~4.9 GiB) + fp16 mmproj. --image-min-tokens 1024 per the model's
  # own Qwen-VL grounding warning. Not a chat/reasoning model: reasoning left off,
  # low temp for stable captions. Bespoke cmd (qwen_base macro is Qwen3.6-MoE-tuned).
  #
  # Moved bee -> stock llama-server: nothing here needs bee's DFlash work, and
  # this keeps bee's surface to the two Gemma entries. Verified against the base
  # image's binary (upstream 7ea23ddf, 2026-05-21): LM arch `qwen35` and
  # projector `qwen3vl_merger` are both registered, and every flag below parses,
  # `-ngl all` included.
  "ToriiGate-0.5":
    cmd: |
      llama-server
      --port ${PORT}
      -m /models/ToriiGate-0.5-Q8_0.gguf
      --mmproj /models/mmproj-ToriiGate-0.5-fp16.gguf
      --no-mmproj-offload
      -c 8192
      -ngl all
      -b 2048
      -ub 512
      --flash-attn on
      --cache-type-k f16
      --cache-type-v f16
      --kv-unified
      --cache-ram 0
      --no-mmap
      --mlock
      --no-host
      -np 1
      --jinja
      --image-min-tokens 1024
      --image-max-tokens 4096
      --metrics
      --temp 0.5
      --top-p 0.9
      --top-k 40
      --min-p 0.0

  # -------- jina-embeddings-v5-text-small-retrieval (memory embedder) --------
  # Serves the Hermes personas' OpenViking memory store (1024-dim, 119 languages,
  # Qwen3-0.6B-derived -> --pooling last). First-party jinaai Q8_0 GGUF (610 MiB);
  # the pre-merged `-retrieval` task variant, so no query-side instruct prefix.
  # Stock llama-server, not ik/bee: nothing here needs their MoE/vision work.
  # Measured 2026-07-20: loads in 0.7 s, ~2.1 GiB VRAM at -c 8192, 24 ms warm
  # round-trip, Recall@1 1.00 on a 24-doc zh/en/ja probe set.
  # -b 512 is fine despite -c 8192 — causal decoder, so long inputs chunk-prefill
  # (verified: 3520-token zh document embeds cleanly).
  # NOTE: licence is CC BY-NC 4.0 — personal use only, see the OpenViking plan.
  "jina-v5-small-retrieval":
    cmd: |
      llama-server
      --port ${PORT}
      -m /models/jina-v5-small-retrieval-Q8_0.gguf
      --alias jina-v5-small-retrieval
      --embedding
      --pooling last
      -ngl 99
      -c 8192
      -b 512
      -ub 512
      --metrics

# =============================================================================
# Groups — the embedder must coexist with a chat model, not swap against it.
#   exclusive: false  -> loading it does not unload the chat model
#   persistent: true  -> a chat model loading does not unload it
# globalTTL still reaps it when idle; reload is ~0.7 s, so that is cheap.
# Headroom measured 2026-07-20 on the worst case (Qwen3.6-35B, 21.2 GiB):
# 23.7 / 24.0 GiB with both resident. Re-measure before adding a reranker.
# =============================================================================
groups:
  "embeddings":
    swap: false
    exclusive: false
    persistent: true
    members:
      - "jina-v5-small-retrieval"
