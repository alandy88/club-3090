# =============================================================================
# llama-swap config — 7 models, single RTX 3090 (24 GB), hot-swap on demand
#
# Shared flag sets live in `macros:` and are spliced into each model's `cmd`
# via ${macro_name}. llama-swap shlex-parses the result, so whitespace
# (including newlines from `|` block scalars) is irrelevant.
# =============================================================================

healthCheckTimeout: 120
logLevel: debug
logToStdout: "upstream"
globalTTL: 300

macros:
  # ---------- Qwen3.6 vision-MoE (ik-llama backend) ----------
  # Per-model overrides only: -m, --mmproj, and (for 35B-A3B) -ngld 99.
  "qwen_base": |
    ik-llama-server
    --chat-template-kwargs '{"preserve_thinking":true}'
    --port ${PORT}
    --threads 8
    --threads-batch 8
    --threads-mtmd 8
    -c 156000
    -ngl 99
    -fa on
    -b 1024
    -ub 512
    -amb 512
    --cache-type-k q8_0
    --cache-type-v q6_0
    -khad
    -vhad
    --cache-ram 32768
    --cache-ram-similarity 0.50
    --cache-ram-n-min 0
    --spec-type mtp:n_max=5,p_min=0.5
    --spec-autotune
    --merge-qkv
    --merge-up-gate-experts
    --ctx-checkpoints 32
    -np 1
    --jinja
    --parallel-tool-calls
    --reasoning on
    --reasoning-format deepseek
    --chat-template-file /models/qwen3.6-chat-template.jinja
    --no-mmproj-offload
    --image-min-tokens 1024
    --image-max-tokens 4096
    --temp 0.6
    --top-p 0.95
    --top-k 20
    --min-p 0
    --metrics
    --verbose-prompt

  # qwen_base minus MTP/draft flags — for quants without nextn (MTP) tensors.
  "qwen_base_nomtp": |
    ik-llama-server
    --chat-template-kwargs '{"preserve_thinking":true}'
    --port ${PORT}
    --threads 8
    --threads-batch 8
    --threads-mtmd 8
    -c 156000
    -ngl 99
    -fa on
    -b 1024
    -ub 512
    -amb 512
    --cache-type-k q8_0
    --cache-type-v q6_0
    -khad
    -vhad
    --cache-ram 32768
    --cache-ram-similarity 0.50
    --cache-ram-n-min 0
    --merge-qkv
    --merge-up-gate-experts
    --ctx-checkpoints 32
    -np 1
    --jinja
    --parallel-tool-calls
    --reasoning on
    --reasoning-format deepseek
    --chat-template-file /models/qwen3.6-chat-template.jinja
    --no-mmproj-offload
    --image-min-tokens 1024
    --image-max-tokens 4096
    --temp 0.6
    --top-p 0.95
    --top-k 20
    --min-p 0
    --metrics
    --verbose-prompt

  # Sampling used by the "creative" Gemma-4 heretic variants.
  "gemma_sampling_creative": |
    --temp 1.0
    --top-p 0.95
    --top-k 64
    --dry-multiplier 0.4
    --dry-base 1.75
    --dry-allowed-length 2
    --dry-penalty-last-n -1

  # ---------- Gemma-4 26B-A4B MoE DFlash (beellama backend) ----------
  # Swapped from atomic-MTP -> beellama DFlash. Q8/Q5_1 KV. Vision via mmproj (CPU offload).
  # bee v0.4.0 replaced the fork DFlash with upstream draft-dflash: the type is
  # renamed, --spec-dflash-cross-ctx is gone, and the draft GGUF must carry
  # upstream's `dflash` arch (the old IQ4_XS file is `dflash-draft`, kept on disk
  # for rollback to v0.3.1). Draft now Anbeeld's Q4_K_M (267 MB vs 235 MB).
  # Without --spec-draft-n-max the draft limit comes from dflash.block_size - 1.
  "gemma_bee_engine_26b": |
    bee-llama-server
    --port ${PORT}
    --spec-type draft-dflash
    --spec-draft-model /models/gemma4-26b-a4b-it-dflash-Q4_K_M.gguf
    --spec-draft-ngl all
    -c 156000
    -ngl all
    -b 2048
    -ub 512
    --flash-attn on
    --cache-type-k q8_0
    --cache-type-v q5_1
    --kv-unified
    --cache-ram 0
    --no-mmap
    --mlock
    --no-host
    -np 1
    --jinja
    --reasoning on
    --metrics

models:
  # -------- Qwen3.6 vision-MoE --------
  "Qwen3.6-27B":
    cmd: |
      ${qwen_base}
      -m /models/Qwen3.6-27B-MTP-IQ4_KS.gguf
      --mmproj /models/mmproj-Qwen3.6-27B-BF16.gguf

  # ==========================================================================
  # Qwen3.6 35B-A3B — shapelearn default + heretic served.
  # Benched 2026-06-01 (ik-llama, -c 156000, thinking off; wall tok/s narr/code):
  #   DEFAULT shapelearn (MTP) .... 155 / 194,  21.2 GB  (faster code via MTP)
  #   heretic (no-MTP) ............ 165 / 162,  20.0 GB  (uncensored)
  #   apex I-Compact (no-MTP) ..... 158 / 155,  18.7 GB  (smallest, most headroom)
  # ==========================================================================

  # DEFAULT — original ShapeLearn (byteshape) IQ4_XS, native MTP speculation.
  # Same quant upstream validated as best single-3090 8-pack (byteshape-iq4xs/mtp.yml).
  "Qwen3.6-35B":
    cmd: |
      ${qwen_base}
      -m /models/Qwen3.6-35B-A3B-IQ4_XS-3.97bpw.gguf
      --mmproj /models/mmproj-Qwen3.6-35B-A3B-BF16.gguf
      -ngld 99

  # mradermacher i1-IQ4_XS uncensored heretic (no MTP tensors).
  "Qwen3.6-35B-Heretic":
    cmd: |
      ${qwen_base_nomtp}
      -m /models/Qwen3.6-35B-A3B-uncensored-heretic.i1-IQ4_XS.gguf
      --mmproj /models/mmproj-Qwen3.6-35B-A3B-BF16.gguf

  # ALT (inactive) — mudler APEX I-Compact, uncensored, no MTP (smallest / most headroom).
  # "Qwen3.6-35B-apex":
  #   cmd: |
  #     ${qwen_base_nomtp}
  #     -m /models/Qwen3.6-35B-A3B-uncensored-heretic-APEX-I-Compact.gguf
  #     --mmproj /models/mmproj-Qwen3.6-35B-A3B-BF16.gguf

  # RETIRED — Gemma4-31B (uncensored-heretic) and Gemma4-31B-Gembrain, both on
  # the gemma_bee_engine macro (removed with them). Weights stay in /models
  # (gemma-4-31B-it-uncensored-heretic-Q4_K_M.gguf, Gembrain-31B-Q4_K_M.gguf)
  # along with their gemma4-31b-it-dflash-IQ4_XS.gguf draft, so the revert is
  # config-only — but only back to a bee v0.3.1 pin, since that draft is in the
  # pre-v0.4.0 `dflash-draft` format.

  # -------- Gemma-4 26B-A4B MoE MTP --------
  # QAT-heretic UD-Q4_K_XL weights (~13.3 GiB; Google QAT base, near-bf16 @ 4-bit)
  # on the DFlash/156K macro. ~4 GB smaller than the prior Q5_K_M -> more headroom.
  "Gemma4-26B":
    cmd: |
      ${gemma_bee_engine_26b}
      -m /models/gemma-4-26B-A4B-it-qat-heretic-UD-Q4_K_XL.gguf
      --mmproj /models/mmproj-gemma-4-26B-A4B-BF16.gguf
      --no-mmproj-offload
      ${gemma_sampling_creative}


  # -------- Gemma-4 12B (bee — long-ctx + vision; no DFlash drafter published) --------
  # Original-model UD-Q8_K_XL (~13.6 GiB; QAT Q4 retired — Q8 of the original tracks
  # BF16 closer, see unsloth QAT KLD table). 256K ctx: --override-kv lifts the 131K
  # n_ctx_train cap; p-RoPE extrapolates cleanly (upstream NIAH @ 200K).
  # Stock Gemma sampling. f16 KV: ~19 GB fit.
  "Gemma4-12B":
    cmd: |
      bee-llama-server
      --port ${PORT}
      -m /models/gemma-4-12b-it-UD-Q8_K_XL.gguf
      --mmproj /models/mmproj-gemma-4-12B-BF16.gguf
      --no-mmproj-offload
      -c 262144
      --override-kv gemma4.context_length=int:262144
      -ngl all
      -b 2048
      -ub 512
      --flash-attn on
      --cache-type-k f16
      --cache-type-v f16
      --kv-unified
      --cache-ram 0
      --no-mmap
      --mlock
      --no-host
      -np 1
      --jinja
      --reasoning on
      --metrics
      --temp 1.0
      --top-k 64
      --top-p 0.95
      --min-p 0.0

  # -------- ToriiGate-0.5 (stock — Qwen3.5-4B VLM, Danbooru/anime captioner) --------
  # Single-image, single-turn captioner (Minthy/ToriiGate-0.5; DraconicDragon GGUF).
  # Q8_0 LM (~4.9 GiB) + fp16 mmproj. --image-min-tokens 1024 per the model's
  # own Qwen-VL grounding warning. Not a chat/reasoning model: reasoning left off,
  # low temp for stable captions. Bespoke cmd (qwen_base macro is Qwen3.6-MoE-tuned).
  #
  # Moved bee -> stock llama-server: nothing here needs bee's DFlash work, and
  # this keeps bee's surface to the two Gemma entries. Verified against the base
  # image's binary (upstream 7ea23ddf, 2026-05-21): LM arch `qwen35` and
  # projector `qwen3vl_merger` are both registered, and every flag below parses,
  # `-ngl all` included.
  "ToriiGate-0.5":
    cmd: |
      llama-server
      --port ${PORT}
      -m /models/ToriiGate-0.5-Q8_0.gguf
      --mmproj /models/mmproj-ToriiGate-0.5-fp16.gguf
      --no-mmproj-offload
      -c 8192
      -ngl all
      -b 2048
      -ub 512
      --flash-attn on
      --cache-type-k f16
      --cache-type-v f16
      --kv-unified
      --cache-ram 0
      --no-mmap
      --mlock
      --no-host
      -np 1
      --jinja
      --image-min-tokens 1024
      --image-max-tokens 4096
      --metrics
      --temp 0.5
      --top-p 0.9
      --top-k 40
      --min-p 0.0

  # -------- jina-embeddings-v5-text-small-retrieval (memory embedder) --------
  # Serves the Hermes personas' OpenViking memory store (1024-dim, 119 languages,
  # Qwen3-0.6B-derived -> --pooling last). First-party jinaai Q8_0 GGUF (610 MiB);
  # the pre-merged `-retrieval` task variant, so no query-side instruct prefix.
  # Stock llama-server, not ik/bee: nothing here needs their MoE/vision work.
  # Measured 2026-07-20: loads in 0.7 s, ~2.1 GiB VRAM at -c 8192, 24 ms warm
  # round-trip, Recall@1 1.00 on a 24-doc zh/en/ja probe set.
  # -b 512 is fine despite -c 8192 — causal decoder, so long inputs chunk-prefill
  # (verified: 3520-token zh document embeds cleanly).
  # NOTE: licence is CC BY-NC 4.0 — personal use only, see the OpenViking plan.
  "jina-v5-small-retrieval":
    cmd: |
      llama-server
      --port ${PORT}
      -m /models/jina-v5-small-retrieval-Q8_0.gguf
      --alias jina-v5-small-retrieval
      --embedding
      --pooling last
      -ngl 99
      -c 8192
      -b 512
      -ub 512
      --metrics

# =============================================================================
# Groups — the embedder must coexist with a chat model, not swap against it.
#   exclusive: false  -> loading it does not unload the chat model
#   persistent: true  -> a chat model loading does not unload it
# globalTTL still reaps it when idle; reload is ~0.7 s, so that is cheap.
# Headroom measured 2026-07-20 on the worst case (Qwen3.6-35B, 21.2 GiB):
# 23.7 / 24.0 GiB with both resident. Re-measure before adding a reranker.
# =============================================================================
groups:
  "embeddings":
    swap: false
    exclusive: false
    persistent: true
    members:
      - "jina-v5-small-retrieval"
