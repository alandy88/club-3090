# =============================================================================
# llama-swap config — 4 models, single RTX 3090 (24 GB), hot-swap on demand
# =============================================================================

healthCheckTimeout: 120
logLevel: debug
logToStdout: "upstream"
globalTTL: 300

models:
  "Qwen3.6-27B-MTP-IQ4_KS":
    cmd: |
      ik-qwen-server
      --port ${PORT}
      -m /models/Qwen3.6-27B-MTP-IQ4_KS.gguf
      --mmproj /models/mmproj-Qwen3.6-27B-BF16.gguf
      --threads 8
      --threads-batch 8
      --threads-mtmd 8
      -c 156000
      -ngl 99
      -fa on
      -b 1024
      -ub 1024
      --cache-type-k q8_0
      --cache-type-v q8_0
      -khad
      -vhad
      --cache-ram 32768
      --cache-ram-similarity 0.50
      --cache-ram-n-min 0
      --multi-token-prediction
      --draft-max 5
      --draft-p-min 0.5
      --merge-qkv
      --merge-up-gate-experts
      --ctx-checkpoints 32
      -np 1
      --jinja
      --parallel-tool-calls
      --reasoning on
      --reasoning-format deepseek
      --chat-template-file /models/qwen3.6-chat-template.jinja
      --no-mmproj-offload
      --image-min-tokens 1024
      --image-max-tokens 4096
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0
      --metrics
      --verbose-prompt

  "G4-MeroMero-31B-heretic-Q4_K_M":
    cmd: |
      atomic-llama-server
      --port ${PORT}
      -m /models/G4-MeroMero-31B-uncensored-heretic-Q4_K_M.gguf
