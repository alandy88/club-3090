# =============================================================================
# llama-swap config — 6 models, single RTX 3090 (24 GB), hot-swap on demand
#
# Shared flag sets live in `macros:` and are spliced into each model's `cmd`
# via ${macro_name}. llama-swap shlex-parses the result, so whitespace
# (including newlines from `|` block scalars) is irrelevant.
# =============================================================================

healthCheckTimeout: 120
logLevel: debug
logToStdout: "upstream"
globalTTL: 300

macros:
  # ---------- Qwen3.6 vision-MoE (ik-llama backend) ----------
  # Per-model overrides only: -m, --mmproj, and (for 35B-A3B) -ngld 99.
  "qwen_base": |
    ik-llama-server
    --chat-template-kwargs '{"preserve_thinking":true}'
    --port ${PORT}
    --threads 8
    --threads-batch 8
    --threads-mtmd 8
    -c 156000
    -ngl 99
    -fa on
    -b 1024
    -ub 512
    -amb 512
    --cache-type-k q8_0
    --cache-type-v q6_0
    -khad
    -vhad
    --cache-ram 32768
    --cache-ram-similarity 0.50
    --cache-ram-n-min 0
    --spec-type mtp:n_max=5,p_min=0.5
    --merge-qkv
    --merge-up-gate-experts
    --ctx-checkpoints 32
    -np 1
    --jinja
    --parallel-tool-calls
    --reasoning on
    --reasoning-format deepseek
    --chat-template-file /models/qwen3.6-chat-template.jinja
    --no-mmproj-offload
    --image-min-tokens 1024
    --image-max-tokens 4096
    --temp 0.6
    --top-p 0.95
    --top-k 20
    --min-p 0
    --metrics
    --verbose-prompt

  # qwen_base minus MTP/draft flags — for quants without nextn (MTP) tensors.
  "qwen_base_nomtp": |
    ik-llama-server
    --chat-template-kwargs '{"preserve_thinking":true}'
    --port ${PORT}
    --threads 8
    --threads-batch 8
    --threads-mtmd 8
    -c 156000
    -ngl 99
    -fa on
    -b 1024
    -ub 512
    -amb 512
    --cache-type-k q8_0
    --cache-type-v q6_0
    -khad
    -vhad
    --cache-ram 32768
    --cache-ram-similarity 0.50
    --cache-ram-n-min 0
    --merge-qkv
    --merge-up-gate-experts
    --ctx-checkpoints 32
    -np 1
    --jinja
    --parallel-tool-calls
    --reasoning on
    --reasoning-format deepseek
    --chat-template-file /models/qwen3.6-chat-template.jinja
    --no-mmproj-offload
    --image-min-tokens 1024
    --image-max-tokens 4096
    --temp 0.6
    --top-p 0.95
    --top-k 20
    --min-p 0
    --metrics
    --verbose-prompt

  # ---------- Gemma-4 31B DFlash (beellama backend) ----------
  # Swapped from atomic-MTP -> beellama DFlash. Q8/Q5_1 KV. Shared by 31B heretic + Gembrain.
  "gemma_bee_engine": |
    bee-llama-server
    --port ${PORT}
    --spec-type dflash
    --spec-draft-model /models/gemma4-31b-it-dflash-IQ4_XS.gguf
    --spec-draft-ngl all
    --spec-dflash-cross-ctx 512
    -c 100000
    -ngl all
    -b 2048
    -ub 512
    --flash-attn on
    --cache-type-k q5_1
    --cache-type-v q4_0
    --kv-unified
    --cache-ram 0
    --no-mmap
    --mlock
    --no-host
    -np 1
    --jinja
    --reasoning on
    --metrics

  # Sampling used by the 3 "creative" Gemma-4 heretic variants.
  # Gembrain ships its own (top-k 0 / min-p / adaptive).
  "gemma_sampling_creative": |
    --temp 1.0
    --top-p 0.95
    --top-k 64
    --dry-multiplier 0.4
    --dry-base 1.75
    --dry-allowed-length 2
    --dry-penalty-last-n -1

  # ---------- Gemma-4 26B-A4B MoE DFlash (beellama backend) ----------
  # Swapped from atomic-MTP -> beellama DFlash. Q8/Q5_1 KV. Vision via mmproj (CPU offload).
  "gemma_bee_engine_26b": |
    bee-llama-server
    --port ${PORT}
    --spec-type dflash
    --spec-draft-model /models/gemma4-26b-a4b-it-dflash-IQ4_XS.gguf
    --spec-draft-ngl all
    --spec-dflash-cross-ctx 1024
    -c 156000
    -ngl all
    -b 2048
    -ub 512
    --flash-attn on
    --cache-type-k q8_0
    --cache-type-v q5_1
    --kv-unified
    --cache-ram 0
    --no-mmap
    --mlock
    --no-host
    -np 1
    --jinja
    --reasoning on
    --metrics

models:
  # -------- Qwen3.6 vision-MoE --------
  "Qwen3.6-27B":
    cmd: |
      ${qwen_base}
      -m /models/Qwen3.6-27B-MTP-IQ4_KS.gguf
      --mmproj /models/mmproj-Qwen3.6-27B-BF16.gguf

  # ==========================================================================
  # Qwen3.6 35B-A3B — shapelearn default + heretic + Carnice apex served.
  # Benched 2026-06-01 (ik-llama, -c 156000, thinking off; wall tok/s narr/code):
  #   DEFAULT shapelearn (MTP) .... 155 / 194,  21.2 GB  (faster code via MTP)
  #   heretic (no-MTP) ............ 165 / 162,  20.0 GB  (uncensored)
  #   apex I-Compact (no-MTP) ..... 158 / 155,  18.7 GB  (smallest, most headroom)
  # ==========================================================================

  # DEFAULT — original ShapeLearn (byteshape) IQ4_XS, native MTP speculation.
  # Same quant upstream validated as best single-3090 8-pack (byteshape-iq4xs/mtp.yml).
  "Qwen3.6-35B":
    cmd: |
      ${qwen_base}
      -m /models/Qwen3.6-35B-A3B-IQ4_XS-4.19bpw.gguf
      --mmproj /models/mmproj-Qwen3.6-35B-A3B-BF16.gguf
      -ngld 99

  # mradermacher i1-IQ4_XS uncensored heretic (no MTP tensors).
  "Qwen3.6-35B-Heretic":
    cmd: |
      ${qwen_base_nomtp}
      -m /models/Qwen3.6-35B-A3B-uncensored-heretic.i1-IQ4_XS.gguf
      --mmproj /models/mmproj-Qwen3.6-35B-A3B-BF16.gguf

  # Carnice (mudler) APEX-MTP I-Compact — 35B-A3B merge with native MTP (~16.1 GiB).
  "Qwen3.6-35B-Apex":
    cmd: |
      ${qwen_base}
      -m /models/Carnice-Qwen3.6-MoE-35B-A3B-APEX-MTP-I-Compact.gguf
      --mmproj /models/mmproj-Qwen3.6-35B-A3B-BF16.gguf
      -ngld 99

  # ALT (inactive) — mudler APEX I-Compact, uncensored, no MTP (smallest / most headroom).
  # "Qwen3.6-35B-apex":
  #   cmd: |
  #     ${qwen_base_nomtp}
  #     -m /models/Qwen3.6-35B-A3B-uncensored-heretic-APEX-I-Compact.gguf
  #     --mmproj /models/mmproj-Qwen3.6-35B-A3B-BF16.gguf

  # -------- Gemma-4 31B MTP --------
  "Gemma4-31B":
    cmd: |
      ${gemma_bee_engine}
      -m /models/gemma-4-31B-it-uncensored-heretic-Q4_K_M.gguf
      ${gemma_sampling_creative}

  "Gemma4-31B-Gembrain":
    cmd: |
      ${gemma_bee_engine}
      -m /models/Gembrain-31B-Q4_K_M.gguf
      --temp 1.0
      --top-p 0.95
      --top-k 0
      --min-p 0.03
      --dry-multiplier 0.8
      --dry-base 1.75
      --dry-allowed-length 10
      --dry-penalty-last-n -1
      --adaptive-target 0.6
      --adaptive-decay 0.5

  # -------- Gemma-4 26B-A4B MoE MTP --------
  # QAT-heretic UD-Q4_K_XL weights (~13.3 GiB; Google QAT base, near-bf16 @ 4-bit)
  # on the DFlash/156K macro. ~4 GB smaller than the prior Q5_K_M -> more headroom.
  "Gemma4-26B":
    cmd: |
      ${gemma_bee_engine_26b}
      -m /models/gemma-4-26B-A4B-it-qat-heretic-UD-Q4_K_XL.gguf
      --mmproj /models/mmproj-gemma-4-26B-A4B-BF16.gguf
      --no-mmproj-offload
      ${gemma_sampling_creative}


  # -------- Gemma-4 12B (bee — long-ctx + vision; no DFlash drafter published) --------
  # Original-model UD-Q8_K_XL (~13.6 GiB; QAT Q4 retired — Q8 of the original tracks
  # BF16 closer, see unsloth QAT KLD table). 256K ctx: --override-kv lifts the 131K
  # n_ctx_train cap; p-RoPE extrapolates cleanly (upstream NIAH @ 200K).
  # Stock Gemma sampling. f16 KV: ~19 GB fit.
  "Gemma4-12B":
    cmd: |
      bee-llama-server
      --port ${PORT}
      -m /models/gemma-4-12b-it-UD-Q8_K_XL.gguf
      --mmproj /models/mmproj-gemma-4-12B-BF16.gguf
      --no-mmproj-offload
      -c 262144
      --override-kv gemma4.context_length=int:262144
      -ngl all
      -b 2048
      -ub 512
      --flash-attn on
      --cache-type-k f16
      --cache-type-v f16
      --kv-unified
      --cache-ram 0
      --no-mmap
      --mlock
      --no-host
      -np 1
      --jinja
      --reasoning on
      --metrics
      --temp 1.0
      --top-k 64
      --top-p 0.95
      --min-p 0.0

  # -------- ToriiGate-0.5 (bee — Qwen3.5-4B VLM, Danbooru/anime captioner) --------
  # Single-image, single-turn captioner (Minthy/ToriiGate-0.5; DraconicDragon GGUF).
  # Q8_0 LM (~4.9 GiB) + fp16 mmproj; qwen3_5 vision loads on the pinned bee engine
  # (verified 2026-06-14: loads + captions). --image-min-tokens 1024 per the model's
  # own Qwen-VL grounding warning. Not a chat/reasoning model: reasoning left off,
  # low temp for stable captions. Bespoke cmd (qwen_base macro is Qwen3.6-MoE-tuned).
  "ToriiGate-0.5":
    cmd: |
      bee-llama-server
      --port ${PORT}
      -m /models/ToriiGate-0.5-Q8_0.gguf
      --mmproj /models/mmproj-ToriiGate-0.5-fp16.gguf
      --no-mmproj-offload
      -c 8192
      -ngl all
      -b 2048
      -ub 512
      --flash-attn on
      --cache-type-k f16
      --cache-type-v f16
      --kv-unified
      --cache-ram 0
      --no-mmap
      --mlock
      --no-host
      -np 1
      --jinja
      --image-min-tokens 1024
      --image-max-tokens 4096
      --metrics
      --temp 0.5
      --top-p 0.9
      --top-k 40
      --min-p 0.0
